<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../Global/global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="../img/logoMusicHub.png" type="image/x-icon">
</head>

<body>
    <div class="tela-login">
        <div class="cabecalho">
            <img src="/img/LogoQuadFundo.png" alt="Logo do MusicHub">
            <div class="texto-cabecalho">
                <h1>Cadastrar</h1>
                <p>Cadastre-se para acessaar o MusicHub</p>
            </div>
        </div>


        <form action="#" class="formulario-cadastro">
            <section class="input-esquerda">
                <div class="campo">
                    <label for="name">Nome Completo</label>
                    <input type="nome" placeholder="Nome Completo">
                </div>
                <div class="campo">
                    <label for="data">Data de Nascimento</label>
                    <input type="date" placeholder="Data de Nascimento">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" placeholder="Senha">
                </div>
            </section>
            <section class="input-direita">
            <div class="campo">
                <label for="username">Nome de usuário</label>
                <input type="text" placeholder="Nome de Usuário">
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="text" placeholder="E-mail">
            </div>
            <div class="campo">
                <label for="senha">Confirmar senha</label>
                <input type="password" placeholder="Confirmar Senha">
            </div>
        </section>
        </form>
        <div class="input-termos">
                <input type="checkbox">
                <p>Eu concordo com os <a href="/Termos/termo.html">termos e condições</a></p>
            </div>
    </div>
</body>

</html>
