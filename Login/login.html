<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../Global/global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="../img/logoMusicHub.png" type="image/x-icon">
</head>
<body>
    <div class="tela-login">
        <div class="cabecalho">
            <img src="" alt="Logo do MusicHub">
            <div class="texto-cabecalho">
            <h1>Acessar</h1>
            <p>Faça login para acessar sua conta no MusicHub</p>
            </div>
        </div>
        <form action="#">
            <div class="input-email">
            <input type="email" placeholder="Email">
            </div>
            <div class="input-senha">
            <input type="password" placeholder="Senha">
            </div>
            <button type="submit">ENTRAR</button>
            <p>Ainda não possui uma conta? Fazer <a href="">cadastro</a></p>
        </form>
    </div>
</body>
</html>
