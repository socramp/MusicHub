<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../Global/global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="../img/logoMusicHub.png" type="image/x-icon">
</head>
<body>
    <div class="tela-login">
        <div class="cabecalho">
            <img src="/MusicHub/img/logoMusicHub.png" alt="Logo do MusicHub">
            <div class="texto-cabecalho">
            <h1>Acessar</h1>
            <p>Faça login para acessar sua conta no MusicHub</p>
            </div>
        </div>

        
        <form action="#" class="formulario">
            <div class="campo">
            <label for="email">Email</label>
            <input type="email" placeholder="Email">
            </div>
            <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" placeholder="Senha">
            </div>
            <button type="submit" class="botao-entrar">ENTRAR</button>
            <p class="texto-cadastro">Ainda não possui uma conta? Fazer <a href="">cadastro</a></p>
        </form>
    </div>
</body>
</html>
